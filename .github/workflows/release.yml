name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Build
        run: make build VERSION=${{ github.ref_name }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: rkmon-arm64
